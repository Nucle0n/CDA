<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="1000"
     viewBox="0 0 1000 1000">

  <!--
    HUD LAYER 01
    Centre exact : 500,500
    Tous les anneaux sont mathématiquement circulaires.
    Fond transparent.
  -->

  <g id="hud-layer-01"
     fill="none"
     stroke="#111"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- =========================
         PISTES PRINCIPALES
         ========================= -->

    <!-- Cercle fin extérieur interrompu -->
    <circle
      cx="500" cy="500" r="390"
      stroke-width="2"
      stroke-dasharray="180 25 70 18 110 35"
    />

    <!-- Deuxième piste -->
    <circle
      cx="500" cy="500" r="370"
      stroke-width="5"
      stroke-dasharray="120 45 35 25 170 55"
      transform="rotate(18 500 500)"
    />

    <!-- Piste fine intermédiaire -->
    <circle
      cx="500" cy="500" r="350"
      stroke-width="2"
      stroke-dasharray="240 35 90 20"
      transform="rotate(-31 500 500)"
    />

    <!-- Piste interne -->
    <circle
      cx="500" cy="500" r="330"
      stroke-width="3"
      stroke-dasharray="80 20 150 40 50 25"
      transform="rotate(67 500 500)"
    />


    <!-- =========================
         PETITS POINTS
         ========================= -->

    <g fill="#111" stroke="none">

      <!-- rayon 380 -->
      <circle cx="500" cy="120" r="6"/>
      <circle cx="500" cy="880" r="6"/>
      <circle cx="120" cy="500" r="6"/>
      <circle cx="880" cy="500" r="6"/>

      <!-- petits marqueurs décalés -->
      <circle cx="500" cy="145" r="3"
              transform="rotate(42 500 500)"/>

      <circle cx="500" cy="145" r="3"
              transform="rotate(118 500 500)"/>

      <circle cx="500" cy="145" r="3"
              transform="rotate(211 500 500)"/>

      <circle cx="500" cy="145" r="3"
              transform="rotate(304 500 500)"/>

    </g>


    <!-- =========================
         GRADUATIONS
         ========================= -->

    <g id="ticks" stroke-width="2">

      <line x1="500" y1="155" x2="500" y2="170"/>

      <use href="#tick" />

    </g>

    <!-- Définition d'une graduation -->
    <defs>
      <line id="tick"
            x1="500" y1="155"
            x2="500" y2="170"/>
    </defs>

    <!-- Graduations répétées autour du vrai centre -->
    <g stroke-width="2" opacity="0.8">
      <use href="#tick" transform="rotate(0   500 500)"/>
      <use href="#tick" transform="rotate(6   500 500)"/>
      <use href="#tick" transform="rotate(12  500 500)"/>
      <use href="#tick" transform="rotate(18  500 500)"/>
      <use href="#tick" transform="rotate(24  500 500)"/>
      <use href="#tick" transform="rotate(30  500 500)"/>

      <use href="#tick" transform="rotate(90  500 500)"/>
      <use href="#tick" transform="rotate(96  500 500)"/>
      <use href="#tick" transform="rotate(102 500 500)"/>
      <use href="#tick" transform="rotate(108 500 500)"/>
      <use href="#tick" transform="rotate(114 500 500)"/>
      <use href="#tick" transform="rotate(120 500 500)"/>

      <use href="#tick" transform="rotate(180 500 500)"/>
      <use href="#tick" transform="rotate(186 500 500)"/>
      <use href="#tick" transform="rotate(192 500 500)"/>
      <use href="#tick" transform="rotate(198 500 500)"/>
      <use href="#tick" transform="rotate(204 500 500)"/>
      <use href="#tick" transform="rotate(210 500 500)"/>

      <use href="#tick" transform="rotate(270 500 500)"/>
      <use href="#tick" transform="rotate(276 500 500)"/>
      <use href="#tick" transform="rotate(282 500 500)"/>
      <use href="#tick" transform="rotate(288 500 500)"/>
      <use href="#tick" transform="rotate(294 500 500)"/>
      <use href="#tick" transform="rotate(300 500 500)"/>
    </g>


    <!-- =========================
         MARQUEURS TECHNIQUES
         ========================= -->

    <g stroke-width="2" fill="#111">

      <!-- Haut -->
      <circle cx="500" cy="100" r="9"/>
      <line x1="500" y1="109" x2="500" y2="135"/>

      <!-- Droite -->
      <circle cx="900" cy="500" r="9"/>
      <line x1="865" y1="500" x2="891" y2="500"/>

      <!-- Bas -->
      <circle cx="500" cy="900" r="9"/>
      <line x1="500" y1="865" x2="500" y2="891"/>

      <!-- Gauche -->
      <circle cx="100" cy="500" r="9"/>
      <line x1="109" y1="500" x2="135" y2="500"/>

    </g>

  </g>

</svg>