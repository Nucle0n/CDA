<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page de révision sur les formulaires html">
    <title>Rev Formulaire</title>
    <link rel="stylesheet" href="assets/css/form.css">
</head>
<body>
    <h1>Formulaire HTML</h1>
    <fieldset>
        <legend>les différents types d'input</legend>
        <form action="#" method="post" enctype="multipart/form-data">
            <label for="type-text">text :
                <input type="text" name="texte" id="type-text" placeholder="Un texte" required>
            </label>
            <label for="type-password">password :
                <input type="password" name="pass" id="type-password" placeholder="password" required>
            </label>
            <label for="type-email">email :
                <input type="email" name="email" id="type-email" placeholder="abc@def.ghi">
            </label>
            <label for="type-tel">tel :
                <input type="tel" name="phone" id="type-tel" placeholder="0123456789" pattern="0[1-9][0-9]{8,8}">
            </label>
            <label for="type-url">url :
                <input type="url" name="url" id="type-url" placeholder="url">
            </label>
            <label for="type-color">color :
                <input type="color" name="color" id="type-color">
            </label>
            <label for="tag-textarea">balise textarea :
                <textarea name="request" id="tag-textarea" rows="4" placeholder="Votre demande..."></textarea>
            </label>
            <label for="tag-select">Comment avez vous connu notre agence ?
                <select name="menu-deroulant" id="tag-select">
                    <option value="0">-- merci de sélectioner une option</option>
                    <option value=""></option>
                </select>
            </label>
        </form>
    </fieldset>
</body>
</html>
