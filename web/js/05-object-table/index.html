<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exercice 05 : travail avec un tableau d'objets">
    <title>05 object table</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Espace membres</h1>
        <section id="msg">Identifiant ou mot de passe incorrect</section>
    </header>
    <main>
        <form action="">
            <h2>Identification</h2>
            <label for="id">Identifiant:
                <input type="text" name="identifiant" id="id" required>
            </label>
            <label for="pass">Mot de passe:
                <input type="password" name="pass" id="pass" required>
            </label>
            <button type="submit" id="btn-connex">Connexion</button>
        </form>
    </main>
</body>
</html>
