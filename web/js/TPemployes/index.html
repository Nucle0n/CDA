<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP-Employees</title>
    <script src="assets/js/script.js" defer></script>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header>
        <h1>Employees</h1>
        <p>This is the current list of employees</p>
    </header>
    <main>
        <label for="">
            <input type="search" placeholder="Recherche...">
            <button>Rechercher</button>
        </label>
        <table>
            <thead>
                <tr>
                    <th id="eid" scope="col">EID</th>
                    <th id="name" scope="col">Full Name</th>
                    <th id="email" scope="col">Email</th>
                    <th id="salary" scope="col">Monthly salary</th>
                    <th id="birth" scope="col">Year of birth</th>
                    <th id="actions" scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>
</body>
</html>
